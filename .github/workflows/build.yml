name: build

# Delivery channel for the sideload test builds: every push to the Phase 0 branch builds the
# rootfs, smoke-tests it under proot, builds the APK and publishes it as a prerelease.
on:
  push:
    branches: [ccr-bb6d7bcc-9eojyu]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HERMES_TAG: v0.23.3
  # Full commit the tag must resolve to (the build aborts if the tag was moved).
  HERMES_COMMIT: caafe5389ae585ef77387a962aee05b1bcf17029
  NDK_VERSION: 27.3.13750724

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" >/dev/null
      # The order of the next steps is the contract's (docs/waves/w0-contract.md, 3.2): cheap script checks first,
      # the Gradle unit tests last. Every step fails the job on a non-zero exit.
      - name: PowerShell version
        run: pwsh --version
      - name: Shell syntax checks
        run: |
          # sh -n for POSIX scripts (the launcher, the practice starter, tools/ci); bash -n for scripts whose shebang says bash.
          for f in $(find runtime rootfs proot tools/ci -name '*.sh' | sort); do
            if head -n 1 "$f" | grep -q bash; then
              bash -n "$f" || { echo "syntax error: $f"; exit 1; }
              echo "ok (bash) $f"
            else
              sh -n "$f" || { echo "syntax error: $f"; exit 1; }
              echo "ok (sh) $f"
            fi
          done
      - name: Practice model compiles and passes its selftest
        run: |
          python3 -m py_compile rootfs/smoke/mock_llm.py
          python3 rootfs/smoke/mock_llm.py --selftest
      - name: Generated pixel art is current
        run: python3 tools/art/craft_art.py --check
      - name: UI lint ratchet
        run: pwsh -NoProfile -File tools/lint-ui.ps1 -Check
      - name: Strings check
        run: pwsh -NoProfile -File tools/strings-check.ps1
      - name: Stretched test language is current
        run: pwsh -NoProfile -File tools/make-test-language.ps1 -Check
      - name: Phone tools self-tests
        run: |
          pwsh -NoProfile -File tools/phone-test.ps1 -SelfTest
          pwsh -NoProfile -File tools/phone-perf.ps1 -SelfTest
          pwsh -NoProfile -File tools/lint-ui.ps1 -SelfTest
      - name: APK size script test
        run: sh tools/ci/test-apk-size.sh
      - name: Launcher test (fake proot under a path containing '=', like Android's nativeLibraryDir)
        run: |
          # mksh is the shell Android runs the launcher with
          sudo apt-get update -qq && sudo apt-get install -y -qq mksh
          sh runtime/test-launcher.sh sh dash bash mksh
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  proot:
    name: Build proot (NDK, arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build proot
        run: proot/build-proot.sh --abi arm64-v8a --out "$RUNNER_TEMP/proot-out"
      - name: Start-up check under qemu-user (catches Bionic static-start aborts)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          qemu-aarch64-static "$RUNNER_TEMP/proot-out/libproot.so" --version | head -n 5
      - name: Summary
        run: |
          cat "$RUNNER_TEMP/proot-out/proot-build.info"
          file "$RUNNER_TEMP/proot-out/libproot.so" "$RUNNER_TEMP/proot-out/libproot-loader.so"
          ls -l "$RUNNER_TEMP/proot-out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proot-arm64
          path: ${{ runner.temp }}/proot-out/
          if-no-files-found: error

  rootfs:
    name: Build rootfs (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap debian-archive-keyring xz-utils curl git ca-certificates
      - name: Build rootfs
        run: |
          sudo env XZ_LEVEL=7 HERMES_TAG="$HERMES_TAG" HERMES_COMMIT="$HERMES_COMMIT" \
            rootfs/build-rootfs.sh --arch arm64 --out "$RUNNER_TEMP/dist" --work "$RUNNER_TEMP/rootfs-work"
      - name: Sizes
        run: |
          cat "$RUNNER_TEMP/dist/rootfs-arm64.info"
          ls -l "$RUNNER_TEMP/dist"
          {
            echo '### Rootfs (arm64)'
            echo '```'
            cat "$RUNNER_TEMP/dist/rootfs-arm64.info"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rootfs-arm64
          path: |
            ${{ runner.temp }}/dist/rootfs-arm64.tar.xz
            ${{ runner.temp }}/dist/rootfs-arm64.info
          compression-level: 0
          if-no-files-found: error

  smoke:
    name: Smoke test (proot + Hermes gateway)
    needs: [rootfs, proot]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: rootfs-arm64, path: dl/rootfs }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: proot-arm64, path: dl/proot }
      - name: Extract rootfs (as an unprivileged user, like the app does)
        run: |
          mkdir -p "$RUNNER_TEMP/rootfs"
          time tar -xJf dl/rootfs/rootfs-arm64.tar.xz -C "$RUNNER_TEMP/rootfs"
          echo "extracted size: $(du -sh "$RUNNER_TEMP/rootfs" | cut -f1) ($(du -sb "$RUNNER_TEMP/rootfs" | cut -f1) bytes)"
          echo "archive size: $(stat -c %s dl/rootfs/rootfs-arm64.tar.xz) bytes"
          chmod +x dl/proot/libproot.so dl/proot/libproot-loader.so
      - name: Smoke test
        run: |
          rootfs/smoke/smoke-test.sh --rootfs "$RUNNER_TEMP/rootfs" \
            --proot "$PWD/dl/proot/libproot.so" --loader "$PWD/dl/proot/libproot-loader.so" \
            --work "$RUNNER_TEMP/smoke-work"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke-work/*.log
          if-no-files-found: ignore

  apk:
    name: Build APK
    needs: [unit, smoke, rootfs, proot]
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # this job runs Gradle (downloaded plugins): it never gets write access
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: rootfs-arm64, path: dl/rootfs }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: proot-arm64, path: dl/proot }
      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" >/dev/null
      - name: Extraction test against the real rootfs archive (app extractor vs GNU tar)
        run: |
          POCKETAGENT_ROOTFS_ARCHIVE="$PWD/dl/rootfs/rootfs-arm64.tar.xz" \
            ./gradlew --no-daemon :app:testDebugUnitTest --tests '*RealRootfsExtractionTest*' -i | grep -E "extractor:|PASSED|FAILED|BUILD" || true
          POCKETAGENT_ROOTFS_ARCHIVE="$PWD/dl/rootfs/rootfs-arm64.tar.xz" \
            ./gradlew --no-daemon :app:testDebugUnitTest --tests '*RealRootfsExtractionTest*'
      - name: Detect private signing key
        id: key
        env:
          # only whether the secret exists is read here; its value is never put in this step's environment
          HAS_KEY: ${{ secrets.AGIRI_KEYSTORE_B64 != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then echo "kind=private" >> "$GITHUB_OUTPUT"; else echo "kind=committed" >> "$GITHUB_OUTPUT"; fi
          echo "owner signing key: $(grep kind "$GITHUB_OUTPUT" | tail -n 1)"
      - name: Build both APKs (rootfs and proot embedded)
        run: |
          # release = the owner build (R8, not debuggable); debug = the test twin. Same run number, version codes by the scheme in app/build.gradle.kts.
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug \
            -ProotfsArchive="$PWD/dl/rootfs/rootfs-arm64.tar.xz" \
            -PprootDir="$PWD/dl/proot" \
            -PciRun="${{ github.run_number }}" \
            -PgitCommit="${GITHUB_SHA::12}" \
            -PsigningKind="${{ steps.key.outputs.kind }}"
      - name: Stage the two APKs
        run: |
          RUN="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "Agiri-$RUN-unsigned.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "Agiri-$RUN-test.apk"
          ls -l Agiri-*.apk
      - name: Sign the owner APK
        id: sign
        env:
          # the only step that sees the private key
          KS_B64: ${{ secrets.AGIRI_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.AGIRI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AGIRI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AGIRI_KEY_PASSWORD }}
          LINEAGE_B64: ${{ secrets.AGIRI_LINEAGE_B64 }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          RUN="${{ github.run_number }}"
          sh tools/ci/sign-owner.sh "Agiri-$RUN-unsigned.apk" "Agiri-$RUN.apk" > sign.log
          cat sign.log
          echo "signing=$(sed -n 's/^signing=//p' sign.log | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Verify both APKs
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          RUN="${{ github.run_number }}"
          sh tools/ci/verify-apk.sh "Agiri-$RUN.apk" dev.pocketagent.app 0 "$(( (10000 + RUN) * 100 ))"
          sh tools/ci/verify-apk.sh "Agiri-$RUN-test.apk" dev.pocketagent.app.debug 1 "$(( RUN * 100 ))"
      - name: Size report
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          RUN="${{ github.run_number }}"
          rc=0
          sh tools/ci/apk-size.sh "Agiri-$RUN.apk" owner tools/size-budget.txt size-owner.txt || rc=$?
          sh tools/ci/apk-size.sh "Agiri-$RUN-test.apk" twin tools/size-budget.txt size-twin.txt || true
          { echo "signing=${{ steps.sign.outputs.signing }}"; cat size-owner.txt; echo; cat size-twin.txt; } > size-report.txt
          cat size-report.txt
          {
            echo '### APKs'
            echo '```'
            ls -l "Agiri-$RUN.apk" "Agiri-$RUN-test.apk"
            cat size-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # a verdict "over" fails the job; the report above is still written
          exit "$rc"
      - name: Checksums and summary
        run: |
          RUN="${{ github.run_number }}"
          sha256sum "Agiri-$RUN.apk" "Agiri-$RUN-test.apk" > SHA256SUMS.txt
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          {
            echo '### Signers'
            echo '```'
            echo "owner  $(apksigner verify --print-certs "Agiri-$RUN.apk" | grep 'Signer #1 certificate SHA-256')"
            echo "twin   $(apksigner verify --print-certs "Agiri-$RUN-test.apk" | grep 'Signer #1 certificate SHA-256')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect release files
        run: |
          RUN="${{ github.run_number }}"
          mkdir -p release-files
          cp "Agiri-$RUN.apk" "Agiri-$RUN-test.apk" SHA256SUMS.txt size-report.txt release-files/
          cp dl/rootfs/rootfs-arm64.info release-files/rootfs-arm64.info
          cp dl/proot/proot-build.info release-files/proot-build.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk
          path: release-files/
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish prerelease
    needs: [apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the only job with write access; it runs no project code and has no checkout
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: apk, path: release-files }
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: phase0-${{ github.run_number }}
          RUN: ${{ github.run_number }}
        run: |
          cd release-files
          OWNER_APK="Agiri-$RUN.apk"
          TWIN_APK="Agiri-$RUN-test.apk"
          SIGNING="$(sed -n 's/^signing=//p' size-report.txt | head -n 1)"
          if [ "$SIGNING" = "private" ]; then
            OWNER_KEY="the owner's private key"
          else
            OWNER_KEY="the shared public test key (no private key is configured in CI)"
          fi
          cat > notes.md <<EOF
          Build #$RUN (commit ${GITHUB_SHA::7}).

          - $OWNER_APK is the owner's app (dev.pocketagent.app), optimised (R8), not debuggable. Signed with $OWNER_KEY.
          - $TWIN_APK is the test twin (dev.pocketagent.app.debug, "Agiri Test"), debuggable, with the test hooks. It is always signed with the shared public test key.
          - Install only APKs from this Releases page (or your own local build). tools/local-build.ps1 installs on the owner's app only after its safety checks.
          - Do not install $OWNER_APK over an existing install unless it comes from the same release as the installed app: every CI build carries a new Linux image, and installing it re-extracts the image and moves the agent's data. Owner installs go through tools/local-build.ps1, which checks this.
          - Hermes: ${HERMES_TAG} (${HERMES_COMMIT})
          - Sizes: see size-report.txt; checksums: SHA256SUMS.txt.
          EOF
          # The tag is created on the default branch, not on this commit: the Actions token gets a 403
          # when a tag points at a commit that touches .github/workflows. The build commit is in the notes.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "${{ github.event.repository.default_branch }}" \
            --prerelease --title "Build $RUN" --notes-file notes.md \
            "$OWNER_APK" "$TWIN_APK" SHA256SUMS.txt rootfs-arm64.info proot-build.info size-report.txt
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
