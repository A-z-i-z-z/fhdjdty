name: Yerel Android

on:
  push:
    branches: [ccr-32e370e8-tln28z]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yerel-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  TEST_MODEL_REPO: Qwen/Qwen3-0.6B-GGUF
  TEST_MODEL_QUANT: Q8_0

jobs:
  native-test:
    name: Engine test (real models)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v2-${{ env.TEST_MODEL_REPO }}-${{ env.TEST_MODEL_QUANT }}
      - name: Download test models
        run: |
          mkdir -p models
          [ -f models/qwen3.gguf ] || python3 ci/hf_fetch.py "$TEST_MODEL_REPO" "$TEST_MODEL_QUANT" models/qwen3.gguf
          [ -f models/lfm3.gguf ] || python3 ci/hf_fetch.py LiquidAI/LFM3-1.7B-GGUF Q4_0 models/lfm3.gguf || true
          [ -f models/lfm25.gguf ] || python3 ci/hf_fetch.py LiquidAI/LFM2.5-1.2B-Instruct-GGUF Q4_0 models/lfm25.gguf || true
          [ -f models/mtp.gguf ] || python3 ci/find_mtp.py models/mtp.gguf || true
          ls -la models
      - name: Build engine test
        run: |
          cmake -S android/native-test -B build-nt -DCMAKE_BUILD_TYPE=Release
          cmake --build build-nt --target engine_test -j "$(nproc)"
      - name: Test with Qwen3 0.6B
        run: build-nt/engine_test models/qwen3.gguf "$(nproc)" 2>&1 | tee engine-qwen3.txt; test "${PIPESTATUS[0]}" = 0
      - name: Test with LFM3 1.7B
        if: always()
        continue-on-error: true
        run: |
          [ -f models/lfm3.gguf ] || { echo "LFM3 GGUF not available" | tee engine-lfm3.txt; exit 1; }
          build-nt/engine_test models/lfm3.gguf "$(nproc)" 2>&1 | tee engine-lfm3.txt; test "${PIPESTATUS[0]}" = 0
      - name: Test with LFM2.5 1.2B
        if: always()
        continue-on-error: true
        run: |
          [ -f models/lfm25.gguf ] || { echo "LFM2.5 GGUF not available" | tee engine-lfm25.txt; exit 1; }
          build-nt/engine_test models/lfm25.gguf "$(nproc)" 2>&1 | tee engine-lfm25.txt; test "${PIPESTATUS[0]}" = 0
      - name: Test with an MTP model (Qwen3.5)
        if: always()
        continue-on-error: true
        run: |
          [ -f models/mtp.gguf ] || { echo "no MTP GGUF available" | tee engine-mtp.txt; exit 1; }
          build-nt/engine_test models/mtp.gguf "$(nproc)" 2>&1 | tee engine-mtp.txt; test "${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-test
          path: engine-*.txt

  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK
        run: |
          ls "$ANDROID_HOME/ndk" || true
          [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
      - name: Free disk space for the Hexagon SDK
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          df -h /
      - name: OpenCL headers and link library (GPU backend)
        run: |
          set -e
          O=$RUNNER_TEMP/ocl
          git clone -q --depth 1 -b v2024.10.24 https://github.com/KhronosGroup/OpenCL-Headers $O/OpenCL-Headers
          git clone -q --depth 1 -b v2024.10.24 https://github.com/KhronosGroup/OpenCL-ICD-Loader $O/OpenCL-ICD-Loader
          cmake -S $O/OpenCL-ICD-Loader -B $O/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake \
            -DOPENCL_ICD_LOADER_HEADERS_DIR=$O/OpenCL-Headers -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=28 \
            -DANDROID_STL=c++_shared -DBUILD_TESTING=OFF > /dev/null
          cmake --build $O/build -j "$(nproc)" > /dev/null
          mkdir -p $O/sdk/include $O/sdk/lib
          cp -r $O/OpenCL-Headers/CL $O/sdk/include/
          cp $O/build/libOpenCL.so $O/sdk/lib/
          echo "YEREL_OPENCL_ROOT=$O/sdk" >> "$GITHUB_ENV"
      - name: Hexagon SDK from the Snapdragon toolchain image (NPU backend)
        continue-on-error: true
        run: |
          set -e
          IMG=ghcr.io/snapdragon-toolchain/arm64-android:v0.8
          docker pull -q $IMG
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' $IMG | tee image-env.txt
          SDK=$(grep '^HEXAGON_SDK_ROOT=' image-env.txt | cut -d= -f2-)
          TOOLS=$(grep '^HEXAGON_TOOLS_ROOT=' image-env.txt | cut -d= -f2- || true)
          [ -n "$SDK" ] || { echo "no HEXAGON_SDK_ROOT in the image"; exit 1; }
          CID=$(docker create $IMG)
          mkdir -p $RUNNER_TEMP/hexagon
          docker cp "$CID:$SDK" $RUNNER_TEMP/hexagon/sdk
          echo "YEREL_HEXAGON_SDK_ROOT=$RUNNER_TEMP/hexagon/sdk" >> "$GITHUB_ENV"
          if [ -n "$TOOLS" ]; then
            case "$TOOLS" in
              "$SDK"/*) echo "YEREL_HEXAGON_TOOLS_ROOT=$RUNNER_TEMP/hexagon/sdk/${TOOLS#$SDK/}" >> "$GITHUB_ENV" ;;
              *) docker cp "$CID:$TOOLS" $RUNNER_TEMP/hexagon/tools
                 echo "YEREL_HEXAGON_TOOLS_ROOT=$RUNNER_TEMP/hexagon/tools" >> "$GITHUB_ENV" ;;
            esac
          fi
          docker rm "$CID" > /dev/null
          docker rmi $IMG > /dev/null || true
          du -sh $RUNNER_TEMP/hexagon; df -h /
      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest -Pyerel.ndkVersion=$NDK_VERSION
      - name: Release APK (arm64, CPU + GPU + NPU)
        working-directory: android
        run: |
          build() {
            ./gradlew --no-daemon :app:assembleRelease -Pyerel.ndkVersion=$NDK_VERSION -Pyerel.abis=arm64-v8a \
              -Pyerel.versionCode=${{ github.run_number }} -Pyerel.versionName=1.0.${{ github.run_number }}
          }
          if ! build; then
            # keep the release going without the NPU backend when the Hexagon build breaks
            [ -n "$YEREL_HEXAGON_SDK_ROOT" ] || exit 1
            echo "::warning::build with the Hexagon NPU backend failed, retrying without it"
            echo "npu-build-failed" > ../npu-build-failed
            rm -rf app/.cxx app/build/intermediates/cxx
            YEREL_HEXAGON_SDK_ROOT= YEREL_HEXAGON_TOOLS_ROOT= build
          fi
      - name: Debug APK (x86_64, emulator)
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug -Pyerel.ndkVersion=$NDK_VERSION -Pyerel.abis=x86_64
      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Yerel-1.0.${{ github.run_number }}-arm64.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/yerel-debug-x86_64.apk
          ls -la out
          unzip -l out/Yerel-*-arm64.apk | grep "\.so$" | tee out/native-libs.txt
          [ -f npu-build-failed ] && echo "NPU backend build failed, see the job log" | tee -a out/native-libs.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: android/app/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out

  emulator:
    name: Emulator end-to-end
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: out
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-v1-${{ env.TEST_MODEL_REPO }}-${{ env.TEST_MODEL_QUANT }}
      - name: Download test model
        run: |
          mkdir -p models
          [ -f models/qwen3.gguf ] || python3 ci/hf_fetch.py "$TEST_MODEL_REPO" "$TEST_MODEL_QUANT" models/qwen3.gguf
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/emulator-test.sh out/yerel-debug-x86_64.apk models/qwen3.gguf shots
      - name: Check results
        run: |
          cat shots/replies.txt || true
          test "$(cat shots/failures 2>/dev/null || echo 1)" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: shots

  release:
    name: Publish release
    needs: [apk, native-test, emulator]
    if: always() && needs.apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          ls -R art | head -100
          mkdir -p assets
          cp art/apks/Yerel-*-arm64.apk assets/
          (cd art/emulator-results 2>/dev/null && zip -qr ../../assets/emulator-screenshots.zip .) || true
          (cd art/engine-test 2>/dev/null && zip -qr ../../assets/engine-test-logs.zip .) || true
          for f in art/emulator-results/*.png; do [ -f "$f" ] && cp "$f" "assets/screen-$(basename "$f")"; done
          {
            cat ci/release-notes.md
            echo
            echo "### Bu sürümün testleri"
            echo "- Motor testi (gerçek model): **${{ needs.native-test.result }}**"
            echo "- Emülatör uçtan uca testi: **${{ needs.emulator.result }}**"
            echo
            echo '```'
            cat art/emulator-results/replies.txt 2>/dev/null || true
            grep -h "PASS\|FAIL\|OK:\|FAILED:" art/engine-test/engine-*.txt 2>/dev/null | head -80 || true
            echo '```'
          } > notes.md
          gh release delete yerel-latest --cleanup-tag -y || true
          gh release create yerel-latest assets/* --target "$GITHUB_SHA" \
            --title "Yerel 1.0.${{ github.run_number }}" --notes-file notes.md --latest
