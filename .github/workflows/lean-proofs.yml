name: lean-proofs

on:
  pull_request:
    paths:
      - "lean-proofs/**"
      - ".github/workflows/lean-proofs.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lean-proofs
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib build
        uses: actions/cache@v4
        with:
          path: lean-proofs/.lake
          key: mathlib-${{ hashFiles('lean-proofs/lakefile.toml', 'lean-proofs/lean-toolchain') }}

      - name: Fetch prebuilt Mathlib
        run: lake exe cache get

      - name: Verifier unit tests (core Lean)
        run: python3 -m unittest discover -s tests -v

      - name: Every queued statement elaborates against Mathlib
        run: python3 swarm/verify.py --check-statements

      - name: Re-verify any committed proofs
        run: |
          shopt -s nullglob
          for f in proved/*.lean; do
            echo "checking $f"
            lake env lean "$f"
          done
